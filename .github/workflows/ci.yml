name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lunarmodules/luacheck@v1

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Ubuntu's lua5.1 package: building Lua from lua.org is slower and
      # fails when lua.org is unreachable.
      - name: Install Lua 5.1
        run: |
          for attempt in 1 2 3; do
            sudo apt-get install -y --no-install-recommends lua5.1 && exit 0
            sleep 10
            sudo apt-get update -q || true
          done
          exit 1
      - run: lua5.1 test/ghe_check.lua
      - name: Syntax check
        run: luac5.1 -p metadata.lua lib/*.lua hooks/*.lua

  smoke:
    name: smoke (${{ matrix.os }})
    needs: [lint, unit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tools: >-
              ghe:BurntSushi/ripgrep@14.1.1=rg
              ghe:jqlang/jq@jq-1.7.1=jq
              ghe:cli/cli@2.63.0=gh
              ghe:tree-sitter/tree-sitter@0.24.4=tree-sitter
          - os: ubuntu-24.04-arm
            tools: >-
              ghe:BurntSushi/ripgrep@14.1.1=rg
              ghe:jqlang/jq@jq-1.7.1=jq
              ghe:cli/cli@2.63.0=gh
          - os: macos-latest
            tools: >-
              ghe:BurntSushi/ripgrep@14.1.1=rg
              ghe:jqlang/jq@jq-1.7.1=jq
              ghe:cli/cli@2.63.0=gh
              ghe:tree-sitter/tree-sitter@0.24.4=tree-sitter
          - os: windows-latest
            tools: >-
              ghe:BurntSushi/ripgrep@14.1.1=rg
              ghe:cli/cli@2.63.0=gh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install: false
          cache: false
      - name: Install tools through the plugin
        shell: bash
        env:
          MISE_GHE_API_URL: https://api.github.com
          MISE_GHE_TOKEN: ${{ github.token }}
        run: test/smoke.sh ${{ matrix.tools }}
